name: Feature request
description: Suggest an instruction family, workflow, or analysis improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Analysis problem
      description: What firmware-analysis task is blocked or unnecessarily hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: fixtures
    attributes:
      label: Redistributable fixtures or references
      description: Link specifications or include minimal synthetic bytes.
